    <!-- 
        Main da pagina 
    -->
    <main class="adicionar_borda">
        <!-- Formulário de Cadastro -->
        <form action="cadastro/" method="get" target="_blank">

            <!-- Nome Completo -->
            <div class="m-3">
                <label class="form-label" 
                    for="nome">Nome Completo:</label>
                <input class="form-control"
                    type="text" id="nome" name="nome" 
                    required placeholder="Seu nome completo"
                    title="Informe o seu nome completo (campo obrigatório)">
            </div>


            <div class="m-3">
                <!-- E-mail de login -->
                <label class="form-label" for="email">E-mail:</label>
                <input class="form-control"
                    type="email" id="email" name="email" 
                    required placeholder="exemplo@email.com">
            </div>
            
            <div class="row m-2">
                <!-- Senha -->
                <div class="col-6">
                    <label class="form-label" for=senha">Senha:</label>
                    <input class="form-control"
                        type="password" id="senha" name="senha" 
                        required minlength="6"
                        placeholder="Informe uma senha">            
                </div>

                <!-- Confirmar Senha -->
                <div class="col-6">
                    <label class="form-label"
                            for="confirm_senha">Confirmar:</label>
                    <input class="form-control"
                        type="password" id="confirm_senha" name="senha" 
                        required minlength="6" 
                        placeholder="Confirme a senha informanda enteriormente">
                </div>
            </div>

            <div class="row m-2">
                <div class="col-6">
                    <!-- Data de Nascimento -->
                    <label class="form-label" for="dt_nasc">Data de Nascimento:</label>
                    <input class="form-control"
                        type="date" id="dt_nasc" name="dt_nasc" 
                        required placeholder="99/99/99">
                </div>
                <div class="col-6">
                    <!-- Sexo -->
                    <label class="form-label" for="dt_nasc">Data de Nascimento:</label>
                    <input class="form-control"
                        type="text" id="dt_nasc" name="dt_nasc" 
                        required placeholder="Informe o Sexo">                    
                </div>
            </div>

            <!-- CPF -->
            <div class="m-3">
                <label class="form-label"
                    for="cpf">CPF:</label>
                <input 
                    class="form-control"
                    type="text" 
                    id="cpf" 
                    name="cpf" 
                    placeholder="000.000.000-00" 
                    pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                    title="Formato: 000.000.000-00"
                    required>               
            </div>

            <!-- Campo Telefone (Validação com Regex) -->
            <div class="m-3">
                <label class="form-label"
                    for="telefone">Telefone*:</label>
                <input 
                    class="form-control"
                    type="tel" 
                    id="telefone" 
                    name="telefone" 
                    required 
                    placeholder="(XX) XXXXX-XXXX"
                    pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                    title="Formato: (XX) XXXXX-XXXX"
                >
            </div>

            <!-- CEP -->

            <!-- Logradouro -->

            <!-- Complemento -->

            <!-- Bairro -->

            <!-- Cidade -->

            <!-- Estado -->

            <!-- Botões -->
            <div class="m-3 row">
                <div class="col-6">
                    <button type="submit"   
                        class="form-control btn btn-outline-primary">
                        Enviar
                    </button>
                </div>
                <div class="col-6">
                    <button type="reset" 
                        class="form-control btn btn-outline-warning">
                        Limpar
                    </button>
                </div>
            </div>

        </form>
        <!-- Final do Form -->
