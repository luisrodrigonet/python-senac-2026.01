<!DOCTYPE html>
<html lang="pt-BR">
<!-- Inicio do Head-->
<head>  
    <title>Eletronicos do Papagaio - Formulário de Cadastro</title>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <meta name="description" content="Formulário de Cadastro de clientes">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        .adicionar_borda {
           border-width: 1px;
           border-style: solid;
           border-color: black;            
        }
    </style>

</head>
<!-- Final do Head-->

<!-- Inicio do Body -->
<body class="bg-secondary">
<!-- 
    DIV - Prinicipal
    Area principal do site contem o 
        - Header
        - Main 
        - Footer
 -->
<div id="div_principal" class="container adicionar_borda bg-light">
    <!--
        Header da pagina 
        [-] Logotipo 
        [-] Titulo
        [-] Menu Principal
        [-] Login / Logout / Criar conta
    -->
    <header class="adicionar_borda">
        <div class="row">
            <div class="col-12">
                Logo / Titulo
            </div>
        </div>

        <div class="row">
            <div class="col-9">
                Menu principal
            </div>
            <div class="col-3">
                Login/Logout |
                Cadastrar 
            </div>
        </div>
        
    </header>

    <!-- 
        Main da pagina 
    -->
    <main class="adicionar_borda">
        <!-- Formulário de Cadastro -->
        <form action="cadastro/" method="get" target="_blank">

            <!-- Nome Completo -->
            <div class="m-3">
                <label class="form-label" 
                    for="nome">Nome Completo:</label>
                <input class="form-control"
                    type="text" id="nome" name="nome" 
                    required placeholder="Seu nome completo"
                    title="Informe o seu nome completo (campo obrigatório)">
            </div>


            <div class="m-3">
            <!-- E-mail de login -->
                <label class="form-label" for="email">E-mail:</label>
                <input class="form-control"
                    type="email" id="email" name="email" 
                    required placeholder="exemplo@email.com">
            </div>
            
            <!-- Senha -->
            <div class="m-3">
                <label class="form-label" for=senha">Senha:</label>
                <input class="form-control"
                    type="password" id="senha" name="senha" 
                    required minlength="6"
                    placeholder="Informe uma senha">            
            </div>

            <!-- Confirmar Senha -->
            <div class="m-3">
                <label class="form-label"
                        for="confirm_senha">Confirmar:</label>
                <input class="form-control"
                    type="password" id="confirm_senha" name="senha" 
                    required minlength="6" 
                    placeholder="Confirme a senha informanda enteriormente">
            </div>

            <!-- CPF -->
            <div class="m-3">
                <label class="form-label"
                    for="cpf">CPF:</label>
                <input 
                    class="form-control"
                    type="text" 
                    id="cpf" 
                    name="cpf" 
                    placeholder="000.000.000-00" 
                    pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                    title="Formato: 000.000.000-00"
                    required>               
            </div>

            <!-- Campo Telefone (Validação com Regex) -->
            <div class="m-3">
                <label class="form-label"
                    for="telefone">Telefone*:</label>
                <input 
                    class="form-control"
                    type="tel" 
                    id="telefone" 
                    name="telefone" 
                    required 
                    placeholder="(XX) XXXXX-XXXX"
                    pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                    title="Formato: (XX) XXXXX-XXXX"
                >
            </div>

            <!-- CEP -->

            <!-- Logradouro -->

            <!-- Complemento -->

            <!-- Bairro -->

            <!-- Cidade -->

            <!-- Estado -->

            <!-- Botões -->
            <div class="m-3 row">
                <div class="col-6">
                    <button type="submit"   
                        class="form-control btn btn-outline-primary">
                        Enviar
                    </button>
                </div>
                <div class="col-6">
                    <button type="reset" 
                        class="form-control btn btn-outline-warning">
                        Limpar
                    </button>
                </div>
            </div>

        </form>
        <!-- Final do Form -->
    </main>

    <!--
        Footer da pagina 
        [-] Menu Secundário
        [-] Contato
        [-] Copyright do site
        [-] Redes Sociais
    -->
    <footer class="adicionar_borda">
        <div class="row">
            <div class="col-4">
                Menu Secundário
            </div>

            <div class="col-5">
                Contato <br>
                Copyright
            </div>

            <!--
                Redes Sociais - Github, Youtube, Instagran, 
                                Linkedin, Facebook                
            -->
            <div class="col-3">
                <a href="https://github.com/luisrodrigonet/" 
                   target="_blank" title="Acesse nosso GitHub">
                    <i class="bi bi-github"></i>
                </a>
            </div>
        </div>
    </footer>
</div> 
<!-- Final da Div Principal-->   

<!-- Não apague a tag "SCRIPT" -->
<!-- Bootstrap JS e dependências -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
<!-- Não apague a tag "SCRIPT" -->
</body>
<!-- Final do Body-->
</html>
