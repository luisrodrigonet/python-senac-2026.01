<!DOCTYPE html>
<html lang="pt-BR">
<!-- Inicio do Head-->
<head>  
    <title>[MUDAR]</title>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <meta name="description" content="[MUDAR]">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        .adicionar_borda {
           border-width: 1px;
           border-style: solid;
           border-color: black;            
        }
    </style>

</head>
<!-- Final do Head-->

<!-- Inicio do Body -->
<body class="bg-secondary">
<!-- 
    DIV - Prinicipal
    Area principal do site contem o 
        - Header
        - Main 
        - Footer
 -->
<div id="div_principal" class="container adicionar_borda bg-light">
    <!--
        Header da pagina 
        [-] Logotipo 
        [-] Titulo
        [-] Menu Principal
        [-] Login / Logout / Criar conta
    -->
    <header class="adicionar_borda">
        <div class="row">
            <div class="col-12">
                Logo / Titulo
            </div>
        </div>

        <div class="row">
            <div class="col-9">
                Menu principal
            </div>
            <div class="col-3">
                Login/Logout |
                Cadastrar 
            </div>
        </div>
        
    </header>

    <!-- 
        Main da pagina 
    -->
    <main class="adicionar_borda">
        <!-- Formulário de Cadastro -->
        <form action="cadastro/" method="post" target="_blank">

            <!-- Nome Completo -->
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" 
                required placeholder="Seu nome completo"
                title="Informe o seu nome completo (campo obrigatório)">
            
            <!-- E-mail de login -->
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" 
                required placeholder="exemplo@email.com">
            
            <!-- Senha -->
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" 
                required minlength="6"
                placeholder="Informe uma senha">            

            <!-- Confirmar Senha -->
            <label for="confirm_senha">Confirmar:</label>
            <input type="password" id="confirm_senha" name="confirm_senha" 
                required minlength="6" 
                placeholder="Confirme a senha informanda enteriormente">

            <!-- CPF -->
            <label for="cpf">CPF:</label>
            <input 
                type="text" 
                id="cpf" 
                name="cpf" 
                placeholder="000.000.000-00" 
                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                title="Formato: 000.000.000-00"
                required>               

            <!-- Campo Telefone (Validação com Regex) -->
            <label for="telefone">Telefone*:</label>
            <input 
                type="tel" 
                id="telefone" 
                name="telefone" 
                required 
                placeholder="(XX) XXXXX-XXXX"
                pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                title="Formato: (XX) XXXXX-XXXX"
            >

            <!-- CEP -->

            <!-- Logradouro -->

            <!-- Complemento -->

            <!-- Bairro -->

            <!-- Cidade -->

            <!-- Estado -->

            <!-- Botões -->
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>


        </form>
        <!-- Final do Form -->
    </main>

    <!--
        Footer da pagina 
        [-] Menu Secundário
        [-] Contato
        [-] Copyright do site
        [-] Redes Sociais
    -->
    <footer class="adicionar_borda">
        <div class="row">
            <div class="col-4">
                Menu Secundário
            </div>

            <div class="col-5">
                Contato <br>
                Copyright
            </div>

            <!--
                Redes Sociais - Github, Youtube, Instagran, 
                                Linkedin, Facebook                
            -->
            <div class="col-3">
                <a href="https://github.com/luisrodrigonet/" 
                   target="_blank" title="Acesse nosso GitHub">
                    <i class="bi bi-github"></i>
                </a>
            </div>
        </div>
    </footer>
</div> 
<!-- Final da Div Principal-->   

<!-- Não apague a tag "SCRIPT" -->
<!-- Bootstrap JS e dependências -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
<!-- Não apague a tag "SCRIPT" -->
</body>
<!-- Final do Body-->
</html>
