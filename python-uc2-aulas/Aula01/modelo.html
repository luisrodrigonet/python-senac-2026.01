<!DOCTYPE html>
<html lang="pt-BR">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Pagina HTML 5</title>
    <meta name="description" content="Uma página de exemplo para demonstrar 
                    a estrutura básica do HTML5 com Bootstrap e Font Awesome.">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        header {
            border-color: darkred;
            border-width: 1px;
            border-style: solid;
            padding-top: 20px;
            padding-bottom: 20px;
        }
        main {
            border-color: blue;
            border-width: 1px;
            border-style: dotted;
            padding-top: 20px;
            padding-bottom: 20px;
        }
        footer {
            border-color: chocolate;
            border-width: 1px;
            border-style: dashed;
            padding-top: 20px;
            padding-bottom: 20px;
        }
    </style>

</head>
<body>
    <!-- Header do Site -->
    <header class="container">
        <button type="button" class="btn btn-primary">Primary</button>
    </header>
    <!-- Fim do Header do Site -->

    <!-- Main do Site -->
    <main class="container-fluid">

    </main>
    <!-- Fim da Main do Site -->

    <!-- Footer do Site -->
    <footer id="footer" class="container text-center">
        <p class="text-muted">
            <i class="far fa-copyright icon"></i> 
            2023 - Todos os direitos reservados.
        </p>    
    </footer>
    <!-- Fim do Footer do Site -->


    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
