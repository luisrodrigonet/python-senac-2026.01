<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Codificação de caracteres -->
    <meta charset="UTF-8">
    
    <!-- Configuração para dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título da página (aparece na aba do navegador) -->
    <title>Exemplo de Estrutura HTML5</title>
    
    <!-- Descrição para mecanismos de busca -->
    <meta name="description" content="Uma página de exemplo para demonstrar a estrutura básica do HTML5.">
    
    <!-- Autor do documento -->
    <meta name="author" content="Luis Rodrigo - Papagaio">
</head>
<body>

    <!-- define o cabeçalho de um documento ou seção -->
    <header>
        <h1> Curso de Python - UC2 </h1>
        <p> Aula 01 - Hierarquia de Títulos </p>
        <hr>
    </header>

    <!--  conteúdo principal da página -->
    <main>

        <h1>Título Principal da Página</h1>          <!-- Nível 1 - Mais importante -->
        <h2>Seção Principal</h2>                     <!-- Nível 2 -->
        <h3>Subseção</h3>                            <!-- Nível 3 -->
        <h4>Sub-subseção</h4>                        <!-- Nível 4 -->
        <h5>Divisão Menor</h5>                       <!-- Nível 5 -->
        <h6>Menor Divisão</h6>                       <!-- Nível 6 - Menos importante -->


    </main>

    <footer>
        <hr>
        <p>&copy; 2025 Minha Empresa. Todos os direitos reservados.</p>
        <p>Contato: contato@exemplo.com</p>
    </footer>

</body>
</html>
