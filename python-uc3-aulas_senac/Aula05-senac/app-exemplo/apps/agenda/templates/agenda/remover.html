{% extends "base/_base.html" %}

{% block conteudo %}

<h2>Remover contato</h2>

<div class="alert alert-warning" role="alert">
    Confirma a remoção do contato <strong>{{ contato.nome }}</strong>? Esta ação não poderá ser desfeita.
</div>

<form method="post" action="{% url 'agenda:agenda_remover' contato_id %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar remoção</button>
    <a href="{% url 'agenda:agenda_listar' %}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
